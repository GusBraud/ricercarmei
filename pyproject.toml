[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricercarmei"
version = "0.1.0"
description = "Generate MEI headers from CSV metadata and merge them into MEI files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "et_xmlfile==2.0.0",
    "lxml==6.1.1",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "numpy==2.5.0",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "Pygments==2.20.0",
    "python-dateutil==2.9.0.post0",
    "rich==15.0.0",
    "six==1.17.0",
]

[project.scripts]
ricercarmei = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "main", "process", "utils"]